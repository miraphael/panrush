<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PanRush · 网盘聚合下载器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Pan<span>Rush</span></h1>
  <span class="ver" id="ver"></span>
  <div class="quick">
    <input id="quick-url" placeholder="粘贴任意 HTTP(S) 直链，回车直接下载…">
    <button id="quick-btn">直链下载</button>
  </div>
  <div class="total-speed"><span id="shutdown-tip" class="shutdown hidden"></span><canvas id="speed-chart" width="120" height="26"></canvas> <span id="total-speed-text">0 B/s</span></div>
</header>

<main>
  <aside id="sidebar">
    <h2>网盘</h2>
    <div id="provider-list"></div>
    <div class="settings">
      <h2>设置</h2>
      <label>下载目录<br><input id="cfg-dest" type="text"></label>
      <label>单任务连接数<br><input id="cfg-conns" type="number" min="1" max="64"></label>
      <label>同时下载任务数<br><input id="cfg-tasks" type="number" min="1" max="20"></label>
      <label>全局限速 KB/s（0=不限）<br><input id="cfg-limit" type="number" min="0"></label>
      <label>下载完成后<br><select id="cfg-shutdown">
        <option value="none">无操作</option>
        <option value="shutdown">自动关机</option>
        <option value="sleep">自动睡眠</option>
      </select></label>
      <label class="chk"><input id="cfg-autostart" type="checkbox"> 开机自启</label>
      <button id="cfg-save">保存设置</button>
      <button id="cfg-open">打开下载目录</button>
    </div>
  </aside>

  <section id="browser">
    <div id="cred-panel" class="hidden"></div>
    <div id="file-panel" class="hidden">
      <div id="breadcrumb" class="crumb"></div>
      <table>
        <thead><tr><th>名称</th><th class="size-col">大小</th><th class="act-col"></th></tr></thead>
        <tbody id="file-list"></tbody>
      </table>
    </div>
    <div id="welcome">左侧选择一个网盘开始浏览；或在顶部粘贴直链下载。<br><br>
      每个网盘首次使用需先点击其卡片上的「配置凭据」。</div>
  </section>

  <section id="tasks-pane">
    <h2>下载任务
      <button id="pause-all" class="mini">全部暂停</button>
      <button id="resume-all" class="mini">全部继续</button>
    </h2>
    <div id="task-filters">
      <button class="ftab active" data-f="all">全部</button>
      <button class="ftab" data-f="active">进行中</button>
      <button class="ftab" data-f="done">已完成</button>
      <button class="ftab" data-f="error">失败</button>
    </div>
    <div id="task-list"></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
